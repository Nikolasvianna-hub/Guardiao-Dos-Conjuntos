<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f26">
  <title>Guardião dos Conjuntos</title>
  <link rel="icon" href="data:,">
  <style>
    @font-face { font-family: 'Mouse Memoirs'; src: url('fonts/mouse-memoirs-latin-400-normal.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Lilita One'; src: url('fonts/lilita-one-latin-400-normal.woff2') format('woff2'); font-display: block; }
    html, body { margin: 0; height: 100%; background: #0d0f26; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { width: 100%; height: 100%; }
    canvas { display: block; }
    /* Aviso para girar o celular (o jogo e em retrato) */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0d0f26; color: #FFF3D1;
      font: 28px 'Lilita One', sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; }
    #rotate div { font-size: 64px; margin-bottom: 12px; animation: tilt 1.6s ease-in-out infinite; }
    @keyframes tilt { 0%,100% { transform: rotate(-90deg); } 50% { transform: rotate(0); } }
    @media (pointer: coarse) and (orientation: landscape) and (max-height: 520px) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><div>📱</div>Deixe o celular em pé<br>para jogar</div>
  <noscript>Ative o JavaScript para jogar.</noscript>

  <script src="lib/phaser.min.js"></script>
  <script src="config.js"></script>
  <script src="settings.js"></script>
  <script src="audio.js"></script>
  <script src="ui.js"></script>
  <script src="gestures.js"></script>
  <script src="challenges.js"></script>
  <script src="scenes/BootScene.js"></script>
  <script src="scenes/MenuScene.js"></script>
  <script src="scenes/StoryScene.js"></script>
  <script src="scenes/LevelSelectScene.js"></script>
  <script src="scenes/MagicScene.js"></script>
  <script src="scenes/Main.js"></script>
</body>
</html>
